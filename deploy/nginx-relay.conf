# nginx site for Relay, behind Cloudflare. Installed by hand once; deploys never touch it:
#   sudo cp nginx-relay.conf /etc/nginx/sites-available/relay.alialiabadi.ir
#   sudo ln -s /etc/nginx/sites-available/relay.alialiabadi.ir /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Public TLS ends at Cloudflare; Cloudflare reaches this origin on 443 with SSL mode
# "Full", which accepts the VPS's existing self-signed certificate. ("Full (strict)"
# would need a Cloudflare Origin CA certificate here instead.) No certbot needed.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name relay.alialiabadi.ir;

    ssl_certificate     /etc/nginx/ssl/quicksnap.crt;
    ssl_certificate_key /etc/nginx/ssl/quicksnap.key;

    # $remote_addr is a Cloudflare edge; take the real client from CF-Connecting-IP,
    # trusted only from Cloudflare's ranges (https://www.cloudflare.com/ips/).
    # Scoped to this server block, so other sites are unaffected.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 8m;
    # Relay logs its own requests without content; nginx access logs would add IPs and paths.
    access_log off;
    error_log /var/log/nginx/relay.error.log;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        # Overwrite, never append: Relay trusts the last entry for its auth rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
    }
}

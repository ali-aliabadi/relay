# nginx site for Relay on the VPS. Not deployed automatically: deploys never
# touch nginx. Install it once by hand:
#
#   sudo cp nginx-relay.conf /etc/nginx/sites-available/relay.alialiabadi.ir
#   sudo ln -s /etc/nginx/sites-available/relay.alialiabadi.ir /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx     # reload only if the test passes
#   sudo certbot --nginx -d relay.alialiabadi.ir     # adds HTTPS and the http->https redirect
#
# The port must match RELAY_HOST_PORT in /opt/relay/.env (default 18080).
server {
    listen 80;
    listen [::]:80;
    server_name relay.alialiabadi.ir;

    # Relay limits bodies itself (7 MB); stay just above it.
    client_max_body_size 8m;
    # Request lines carry only IDs, and Relay logs every request already.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        # Overwrite, never append: Relay rate-limits failed logins by this IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }

    # /metrics is on Relay's internal listener and is not reachable from here.
}

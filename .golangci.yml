version: "2"

run:
  timeout: 5m
  build-tags:
    - e2e

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gocognit
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unparam
  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use the injected *slog.Logger
        - pattern: ^log\.(Print|Fatal|Panic).*$
          msg: use the injected *slog.Logger
    funlen:
      lines: 60
      statements: 40
    gocognit:
      min-complexity: 20
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: unused-parameter
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: errorf
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: ^cmd/
        linters: [forbidigo]
      - path: _test\.go$
        linters: [funlen, gocognit, gosec]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ali-aliabadi/relay
